name: Probe runner disk
on: workflow_dispatch
permissions: {}
jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - name: Measure and free disk
        shell: bash
        run: |
          set +e
          d() { df -h /System/Volumes/Data | tail -1; }
          d; ls /Applications; xcrun simctl runtime list 2>&1 | head -40
          echo "== largest folders"; sudo du -xh -d 3 /System/Volumes/Data 2>/dev/null | sort -h | tail -70
          t() { local s; s=$(date +%s); echo "== $*"; "$@" >/dev/null 2>&1; echo "took $(( $(date +%s) - s ))s"; d; }
          t sudo xcrun simctl runtime delete all
          t sudo rm -rf /Library/Developer/CoreSimulator/Images /Library/Developer/CoreSimulator/Cryptex /Library/Developer/CoreSimulator/Profiles/Runtimes "$HOME/Library/Developer/CoreSimulator" "$HOME/Library/Developer/XCTestDevices"
          t sudo rm -rf "$HOME/.dotnet" /usr/local/share/dotnet
          t sudo rm -rf "$HOME/Library/Android" /usr/local/lib/android
          t bash -c 'for x in /Users/runner/hostedtoolcache/*; do [ "$(basename "$x")" = Python ] || sudo rm -rf "$x"; done'
          t sudo rm -rf "/Applications/Google Chrome.app" "/Applications/Firefox.app" "/Applications/Microsoft Edge.app" "/Applications/Google Chrome for Testing.app"
          t sudo rm -rf "$HOME/.rustup" "$HOME/.cargo" "$HOME/.ghcup" /usr/local/microsoft "$HOME/.julia" "$HOME/Library/Caches"
          echo "== after"; sudo du -xh -d 3 /System/Volumes/Data 2>/dev/null | sort -h | tail -40
