name: NxNative IPA Builder

# Builds an unsigned iOS IPA with nxnative on GitHub's free macOS runner (public repo, standard xcode-27 runner).
# Nothing from any game is stored in this repository in readable form:
# - the game files arrive as an AES-256 encrypted 7z archive (release "game-files", made by tools/nx.py upload);
# - the IPA and the build logs leave as AES-256 encrypted 7z archives (release ipa-<run>, artifact logs-<run>).
# The password is the ARCHIVE_PASSWORD secret. Switch 1 games also need the PROD_KEYS_B64 secret.

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Build path"
        required: true
        type: choice
        default: "iPhone 15 Pro or newer (standard)"
        options:
          - "iPhone 15 Pro or newer (standard)"
          - "iPhone 15 or older (BC fallback)"
      nxnative_ref:
        description: "nxnative commit or branch (blank = the pinned commit for the chosen path)"
        required: false
        type: string
        default: ""
      extra_args:
        description: "Extra build options, e.g. --romfs separate --shader-files"
        required: false
        type: string
        default: ""
      allow_other_metal:
        description: "Build shaders even when the Metal compiler is not Xcode 27.2's (may render wrong)"
        required: false
        type: boolean
        default: false
      build_minutes:
        description: "Minutes the build may run before it stops and saves its shader cache (a run is capped at 6 hours)"
        required: false
        type: number
        default: 290
      chain_left:
        description: "How many more runs to start automatically when a build stops at its time budget"
        required: false
        type: number
        default: 4
      resume:
        description: "Restore the newest saved shader cache before building"
        required: false
        type: boolean
        default: true

permissions:
  contents: write   # publishes the encrypted IPA and shader cache as releases
  issues: write     # mirrors build progress into the progress issue
  actions: write    # starts the next run of a chained build

concurrency:
  group: nxnative-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27   # standard runner: free for public repositories (never use the -xlarge label here)
    timeout-minutes: 360

    steps:
      - name: Check secrets
        shell: bash
        env:
          ARCHIVE_PASSWORD: ${{ secrets.ARCHIVE_PASSWORD }}
        run: |
          if [[ -z "$ARCHIVE_PASSWORD" ]]; then
            echo "::error::The ARCHIVE_PASSWORD secret is missing. Run: python tools/nx.py upload <game file>"
            exit 1
          fi

      - name: Choose nxnative source
        id: src
        shell: bash
        env:
          DEVICE: ${{ inputs.device }}
          REF_IN: ${{ inputs.nxnative_ref }}
        run: |
          set -euo pipefail
          if [[ "$DEVICE" == *"BC fallback"* ]]; then
            repo=mianmuhammadse/nxnative; pin=b5ecea6a7241689db07030fa14bc79fd89b06225; label=BC-Fallback
          else
            repo=seedds/nxnative; pin=23790f8dcc3a3491a44f125805dfbf1e5664cd2a; label=Standard
          fi
          ref="${REF_IN:-$pin}"
          {
            echo "repo=$repo"
            echo "ref=$ref"
            echo "label=$label"
          } >> "$GITHUB_OUTPUT"
          {
            echo "GAME_DIR=$RUNNER_TEMP/GameFiles"
            echo "KEYS_DIR=$RUNNER_TEMP/keys"
            echo "OUT_DIR=$RUNNER_TEMP/out"
            echo "LOG_DIR=$RUNNER_TEMP/logs"
          } >> "$GITHUB_ENV"
          echo "Building with $repo @ $ref ($label)"

      - name: Check out nxnative
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.src.outputs.repo }}
          ref: ${{ steps.src.outputs.ref }}
          path: nxnative
          persist-credentials: false

      - name: Check out builder tools
        uses: actions/checkout@v7
        with:
          path: builder
          sparse-checkout: tools
          persist-credentials: false

      - name: Select Xcode 27.2 and free disk space
        shell: bash
        env:
          ALLOW_OTHER_METAL: ${{ inputs.allow_other_metal }}
        run: |
          set +e -uo pipefail
          sw_vers; sysctl -n hw.ncpu hw.memsize
          df -h /System/Volumes/Data 2>/dev/null || df -h /
          XC=/Applications/Xcode_27.2.app
          if [[ -d "$XC" ]]; then
            sudo xcode-select -s "$XC"
            keep="$(cd "$XC" && pwd -P)"
            for x in /Applications/Xcode*.app; do
              real="$(cd "$x" 2>/dev/null && pwd -P || true)"
              [[ "$real" == "$keep" ]] && continue
              echo "Removing $x"; sudo rm -rf "$x"
            done
          elif [[ "$ALLOW_OTHER_METAL" == "true" ]]; then
            echo "::warning::Xcode 27.2 is not on this runner image; using $(xcode-select -p) (allow_other_metal)."
          else
            echo "::error::Xcode 27.2 is not on this runner image (found: $(ls -d /Applications/Xcode*.app | xargs -n1 basename | tr '\n' ' ')). Re-run with allow_other_metal, or update the workflow."
            exit 1
          fi
          # A big game's build needs well over 100 GB (Pokopia: ~25 GB compile cache, ~30 GB shader library, a ~36 GB IPA).
          # None of this is used by the build: simulators, .NET, Android, other tool versions, browsers.
          sudo xcrun simctl runtime delete all >/dev/null 2>&1 || true
          sudo rm -rf /Library/Developer/CoreSimulator/Images /Library/Developer/CoreSimulator/Cryptex /Library/Developer/CoreSimulator/Profiles/Runtimes \
            "$HOME/Library/Developer/CoreSimulator" "$HOME/Library/Developer/XCTestDevices" \
            "$HOME/.dotnet" /usr/local/share/dotnet "${ANDROID_HOME:-/nonexistent-android}" "$HOME/Library/Android" /usr/local/lib/android \
            "/Applications/Google Chrome.app" "/Applications/Google Chrome for Testing.app" "/Applications/Firefox.app" "/Applications/Microsoft Edge.app" \
            "$HOME/.rustup" "$HOME/.cargo" "$HOME/.ghcup" "$HOME/.julia" /usr/local/microsoft "$HOME/Library/Caches" 2>/dev/null || true
          for x in "${RUNNER_TOOL_CACHE:-$HOME/hostedtoolcache}"/*; do [[ "$(basename "$x")" == Python ]] || sudo rm -rf "$x"; done
          xcodebuild -version
          if ! xcrun -sdk iphoneos metal --version >/dev/null 2>&1; then
            echo "Downloading the Metal toolchain"
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk iphoneos metal --version || { echo "::error::The Metal toolchain is not available"; exit 1; }
          echo "Lock expects: $(grep metal_iphoneos nxnative/dm/gfx/tools/dmsh_chain.lock || true)"
          df -h /System/Volumes/Data 2>/dev/null || df -h /

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: bash
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          brew install xcodegen zstd glslang sevenzip
          python -m pip install --upgrade pip
          python -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic "backports.zstd; python_version < '3.14'"

      - name: Keep the shader compile cache compressed
        shell: bash
        run: python builder/tools/patch_nxnative.py nxnative   # fails if nxnative changed under the patch

      - name: Fetch and decrypt game files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_PASSWORD: ${{ secrets.ARCHIVE_PASSWORD }}
          PROD_KEYS_B64: ${{ secrets.PROD_KEYS_B64 }}
        run: |
          set -euo pipefail
          DL="$RUNNER_TEMP/dl"
          mkdir -p "$GAME_DIR" "$KEYS_DIR" "$DL"
          gh release download game-files -R "$GITHUB_REPOSITORY" -D "$DL" -p 'game.7z.*'
          ls -la "$DL"
          first="$(ls "$DL"/game.7z.* | sort | sed -n 1p)"
          7zz x -y -bso0 -bsp0 -p"$ARCHIVE_PASSWORD" -o"$GAME_DIR" "$first"
          rm -rf "$DL"

          # Packages may sit in a subfolder of the archive; keys may have been packed with them.
          find "$GAME_DIR" -mindepth 2 -type f \( -iname '*.nup' -o -iname '*.nsp' -o -iname '*.xci' -o -iname '*.nsz' -o -iname '*.xcz' \) -exec mv -n {} "$GAME_DIR/" \;
          k="$(find "$GAME_DIR" -type f -iname 'prod.keys' | sed -n 1p)"
          if [[ -n "$k" ]]; then mv "$k" "$KEYS_DIR/prod.keys"; fi
          if [[ -n "${PROD_KEYS_B64:-}" ]]; then
            python -c "import base64,os,sys; sys.stdout.buffer.write(base64.b64decode(os.environ['PROD_KEYS_B64']))" > "$KEYS_DIR/prod.keys"
          fi
          [[ -f "$KEYS_DIR/prod.keys" ]] && chmod 600 "$KEYS_DIR/prod.keys"
          find "$GAME_DIR" -mindepth 1 -type d -empty -delete

          shopt -s nullglob nocaseglob
          nups=("$GAME_DIR"/*.nup)
          pkgs=("$GAME_DIR"/*.nsp "$GAME_DIR"/*.xci "$GAME_DIR"/*.nsz "$GAME_DIR"/*.xcz)
          if (( ${#nups[@]} > 0 )); then
            echo "GAME_KIND=switch2" >> "$GITHUB_ENV"
            echo "Switch 2 game (.nup): no keys needed"
          elif (( ${#pkgs[@]} > 0 )); then
            if [[ ! -s "$KEYS_DIR/prod.keys" ]]; then
              echo "::error::Switch 1 games need prod.keys. Add it with: python tools/nx.py keys <path to prod.keys>"
              exit 1
            fi
            echo "GAME_KIND=switch1" >> "$GITHUB_ENV"
            echo "Switch 1 game: ${#pkgs[@]} package(s)"
          else
            echo "::error::The archive holds no .nup, .nsp, .xci, .nsz or .xcz file."
            ls -laR "$GAME_DIR"
            exit 1
          fi

          biggest="$(ls -S "$GAME_DIR" | sed -n 1p)"
          stem="$(printf '%s' "${biggest%.*}" | sed -E 's/\[[^]]*\]//g; s/[^A-Za-z0-9._-]+/_/g; s/^_+//; s/_+$//')"
          echo "IPA_NAME=${stem:-Game}" >> "$GITHUB_ENV"
          ls -la "$GAME_DIR"
          df -h "$RUNNER_TEMP"

      - name: Restore shader cache
        if: inputs.resume
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_PASSWORD: ${{ secrets.ARCHIVE_PASSWORD }}
        run: |
          set -euo pipefail
          tags="$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("shader-cache-"))] | sort_by(.createdAt) | reverse | .[].tagName')"
          tag=""; kind=""
          for t in $tags; do   # newest complete one: streamed parts end with complete.txt; older 7z saves were made whole
            assets="$(gh release view "$t" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            if grep -qx 'complete.txt' <<< "$assets"; then tag="$t"; kind=stream; break; fi
            if grep -qx 'cache.7z.001' <<< "$assets"; then tag="$t"; kind=7z; break; fi
            echo "::warning::$t is incomplete: skipped"
          done
          if [[ -z "$tag" ]]; then echo "No saved shader cache: starting fresh"; exit 0; fi
          echo "Restoring the shader cache from $tag ($kind)"
          if [[ "$kind" == stream ]]; then
            OSSL="$(brew --prefix openssl@3 2>/dev/null)/bin/openssl"; [[ -x "$OSSL" ]] || OSSL=openssl
            python builder/tools/stream_parts.py download "$tag" cache.tzst.enc. \
              | "$OSSL" enc -d -aes-256-ctr -md sha256 -pbkdf2 -iter 200000 -pass env:ARCHIVE_PASSWORD \
              | zstd -d -q -c | tar -xf - -C "$GAME_DIR"
          else
            d="$RUNNER_TEMP/cachedl"; mkdir -p "$d"
            gh release download "$tag" -R "$GITHUB_REPOSITORY" -D "$d" -p 'cache.7z.*'
            7zz x -y -bso0 -bsp0 -p"$ARCHIVE_PASSWORD" -o"$GAME_DIR" "$(ls "$d"/cache.7z.* | sort | sed -n 1p)"
            rm -rf "$d"
          fi
          shopt -s nullglob
          dbs=("$GAME_DIR"/*_build/shader/cache/cas*.db)
          if (( ${#dbs[@]} > 0 )); then python builder/tools/compress_cache.py "${dbs[@]}"; fi   # blobs from unpatched builds
          du -sh "$GAME_DIR"/*_build/shader/cache || true
          df -h "$GAME_DIR"

      - name: Build IPA
        shell: bash
        working-directory: nxnative
        env:
          EXTRA_ARGS: ${{ inputs.extra_args }}
          ALLOW_OTHER_METAL: ${{ inputs.allow_other_metal }}
          BUILD_MINUTES: ${{ inputs.build_minutes }}
          PROGRESS_ISSUE: ${{ vars.PROGRESS_ISSUE }}
          PROGRESS_TOKEN: ${{ github.token }}
        run: |
          set +e -uo pipefail   # GitHub starts bash with -e: a stopped build (exit 143) must reach the checks below
          tok="$PROGRESS_TOKEN"; unset PROGRESS_TOKEN
          touch "$RUNNER_TEMP/build-ran"   # the cache is saved only after a build ran on it
          mkdir -p "$OUT_DIR" "$LOG_DIR"
          log="$LOG_DIR/build.log"
          : > "$log"
          args=("$GAME_DIR" --platform ios -o "$OUT_DIR/$IPA_NAME.ipa" --progress lines)
          if [[ "$GAME_KIND" == "switch1" ]]; then args+=(-k "$KEYS_DIR/prod.keys"); fi
          if [[ "$ALLOW_OTHER_METAL" == "true" ]]; then args+=(--allow-other-metal); fi
          extra=()
          if [[ -n "$EXTRA_ARGS" ]]; then read -r -a extra <<< "$EXTRA_ARGS"; fi
          echo "+ build_ipa_from_nsp.py ${args[*]} ${extra[*]:-}"

          post() {   # mirror the last log lines into the progress issue (edits do not notify anyone)
            [[ -n "${PROGRESS_ISSUE:-}" ]] || return 0
            local body
            body="$(printf '**Run %s** (%s) - %s - %s UTC - disk free: %s\n\n```\n%s\n```\n' "$GITHUB_RUN_NUMBER" "$IPA_NAME" "$1" "$(date -u '+%Y-%m-%d %H:%M')" "$(df -h "$GAME_DIR" | awk 'NR==2 {print $4}')" "$(tail -n 25 "$log" | cut -c1-240)")"
            GH_TOKEN="$tok" gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$PROGRESS_ISSUE" -f body="$body" >/dev/null 2>&1 || true
          }
          ( while sleep 240; do post running; done ) &
          updater=$!

          python scripts/build_ipa_from_nsp.py "${args[@]}" ${extra[@]+"${extra[@]}"} < /dev/null > >(tee -a "$log") 2>&1 &
          pid=$!
          budget=$(( ${BUILD_MINUTES:-300} * 60 ))
          ( sleep "$budget"
            if kill -0 "$pid" 2>/dev/null; then
              touch "$RUNNER_TEMP/stopped"
              echo "Time budget of ${BUILD_MINUTES} minutes reached: stopping the build to save its shader cache" >> "$log"
              kill -TERM "$pid"; sleep 240; kill -KILL "$pid" 2>/dev/null
            fi ) &
          timer=$!
          wait "$pid"; status=$?
          kill "$updater" "$timer" 2>/dev/null || true
          sleep 2
          if [[ -f "$RUNNER_TEMP/stopped" ]]; then
            echo "BUILD_STOPPED=1" >> "$GITHUB_ENV"
            post "stopped at the time budget; saving the shader cache for the next run"
            echo "::notice::Stopped at the ${BUILD_MINUTES}-minute budget; the next run continues from the saved shader cache."
            exit 0
          fi
          if (( status == 0 )); then post "build finished"; else post "build FAILED (exit $status)"; fi
          ls -lh "$OUT_DIR" || true
          exit "$status"

      - name: Collect logs
        if: always()
        shell: bash
        run: |
          mkdir -p "$LOG_DIR"
          for d in "$GAME_DIR"/*_build/logs "$GAME_DIR"/*_survey; do
            [[ -d "$d" ]] && cp -R "$d" "$LOG_DIR/$(basename "$(dirname "$d")")-$(basename "$d")"
          done
          du -sh "$LOG_DIR" || true

      - name: Save shader cache
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_PASSWORD: ${{ secrets.ARCHIVE_PASSWORD }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          if [[ ! -f "$RUNNER_TEMP/build-ran" ]]; then echo "The build did not run: nothing new to save"; exit 0; fi
          if [[ "${BUILD_STOPPED:-}" != "1" && "$JOB_STATUS" == "success" ]]; then echo "The build finished: the IPA is all that is kept"; exit 0; fi
          dirs=("$GAME_DIR"/*_build/shader/cache)
          if (( ${#dirs[@]} == 0 )); then echo "No shader cache to save"; exit 0; fi
          cache="${dirs[0]}"
          for db in "$cache"/cas*.db; do sqlite3 "$db" 'PRAGMA wal_checkpoint(TRUNCATE);' >/dev/null || true; done
          du -sh "$cache"; ls -la "$cache"; df -h "$GAME_DIR"
          rel="${cache#"$GAME_DIR"/}"
          tag="shader-cache-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          old="$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName | select(startswith("shader-cache-"))')"
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --prerelease \
            --title "Encrypted shader cache (run $GITHUB_RUN_NUMBER)" \
            --notes "AES-256 encrypted nxnative compile cache (tar | zstd | openssl aes-256-ctr, in parts), restored by the next build." || exit 1
          # Streamed: compressed, encrypted and uploaded part by part, so no second copy of the cache is ever on disk.
          OSSL="$(brew --prefix openssl@3 2>/dev/null)/bin/openssl"; [[ -x "$OSSL" ]] || OSSL=openssl
          if tar -C "$GAME_DIR" -cf - "$rel" | zstd -1 -T0 -q -c \
              | "$OSSL" enc -aes-256-ctr -md sha256 -pbkdf2 -iter 200000 -salt -pass env:ARCHIVE_PASSWORD \
              | python builder/tools/stream_parts.py upload "$tag" cache.tzst.enc.; then
            date -u > "$RUNNER_TEMP/complete.txt"
            gh release upload "$tag" "$RUNNER_TEMP/complete.txt" -R "$GITHUB_REPOSITORY" || exit 1
          else
            echo "::error::Saving the shader cache failed; the previous one is kept."
            gh release delete "$tag" -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
            exit 1
          fi
          echo "CACHE_SAVED=1" >> "$GITHUB_ENV"
          for t in $old; do [[ "$t" == "$tag" ]] || gh release delete "$t" -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true; done

      - name: Encrypt and publish the IPA
        if: env.BUILD_STOPPED != '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_PASSWORD: ${{ secrets.ARCHIVE_PASSWORD }}
          LABEL: ${{ steps.src.outputs.label }}
          SRC_REPO: ${{ steps.src.outputs.repo }}
          SRC_REF: ${{ steps.src.outputs.ref }}
        run: |
          set -euo pipefail
          ipa="$OUT_DIR/$IPA_NAME.ipa"
          if [[ ! -s "$ipa" ]]; then
            echo "::error::The build did not produce $IPA_NAME.ipa"
            ls -la "$OUT_DIR" || true
            exit 1
          fi
          ls -lh "$ipa"
          rm -rf "$GAME_DIR" "$KEYS_DIR"   # room for the archive
          up="$RUNNER_TEMP/upload"; mkdir -p "$up"
          (cd "$OUT_DIR" && 7zz a -t7z -mx=0 -mhe=on -v1900m -bso0 -bsp0 -p"$ARCHIVE_PASSWORD" "$up/ipa.7z" "$IPA_NAME.ipa")
          rm -f "$ipa"
          ls -lh "$up"
          tag="ipa-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "$up"/* -R "$GITHUB_REPOSITORY" --prerelease \
            --title "Encrypted build $GITHUB_RUN_NUMBER ($LABEL)" \
            --notes "Encrypted with the repository's archive password. Built from $SRC_REPO@$SRC_REF. Download with: python tools/nx.py get-ipa $tag"
          echo "### Encrypted IPA published: release \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Encrypt logs
        if: always()
        shell: bash
        env:
          ARCHIVE_PASSWORD: ${{ secrets.ARCHIVE_PASSWORD }}
        run: |
          [[ -d "$LOG_DIR" ]] || exit 0
          (cd "$LOG_DIR" && 7zz a -t7z -mx=9 -mhe=on -bso0 -bsp0 -p"$ARCHIVE_PASSWORD" "$RUNNER_TEMP/logs-${GITHUB_RUN_NUMBER}.7z" .) || true

      - name: Upload encrypted logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ github.run_number }}
          path: ${{ runner.temp }}/logs-${{ github.run_number }}.7z
          if-no-files-found: ignore
          retention-days: 14

      - name: Continue in a new run
        if: always() && env.BUILD_STOPPED == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN_LEFT: ${{ inputs.chain_left }}
          DEVICE: ${{ inputs.device }}
          SRC_REF: ${{ steps.src.outputs.ref }}
          EXTRA_ARGS: ${{ inputs.extra_args }}
          AOM: ${{ inputs.allow_other_metal }}
          BM: ${{ inputs.build_minutes }}
        run: |
          if [[ "${CACHE_SAVED:-}" != "1" ]]; then echo "::error::The shader cache was not saved: not starting another run."; exit 1; fi
          if (( CHAIN_LEFT <= 0 )); then echo "::warning::No automatic runs left: start the next one by hand (python tools/nx.py build)."; exit 0; fi
          gh workflow run build.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f device="$DEVICE" -f nxnative_ref="$SRC_REF" -f extra_args="$EXTRA_ARGS" \
            -f allow_other_metal="$AOM" -f build_minutes="$BM" -f chain_left="$((CHAIN_LEFT - 1))" -f resume=true
          echo "Started the next run ($((CHAIN_LEFT - 1)) automatic runs left after it)"

      - name: Remove game files and keys
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/GameFiles" "$RUNNER_TEMP/keys" "$RUNNER_TEMP/dl" "$RUNNER_TEMP/upload" "$RUNNER_TEMP/out"
